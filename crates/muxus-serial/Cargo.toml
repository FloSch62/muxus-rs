[package]
name = "muxus-serial"
description = "Serial port transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
muxus-core.workspace = true
async-channel = "2"
# `usbportinfo-location`: the USB locationID macOS reports as `locationId`.
serialport = { version = "4.7", default-features = false, features = ["usbportinfo-location"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Mark/space parity and 1.5 stop bits go into the port's DCB, and the port list comes from
# SetupAPI (the version muxus-os, muxus-store and gpui build on).
windows-sys = { version = "0.61", features = [
    "Win32_Devices_Communication",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
