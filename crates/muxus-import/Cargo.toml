[package]
name = "muxus-import"
description = "Session imports (MobaXterm, SecureCRT), the import review model and command-line launch parsing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
muxus-core.workspace = true
base64 = "0.22"
regex = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_with = { version = "3", default-features = false, features = ["macros", "std"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt", "time"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "process", "rt", "time"] }

[lints]
workspace = true
