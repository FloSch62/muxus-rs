[package]
name = "muxus-rdp"
description = "RDP transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
muxus-core.workspace = true
async-channel = "2"
# IronRDP from git: the crates.io release (0.17.0) predates the bitmap-stride,
# RDP6-orientation and bulk-decompression fixes that xrdp and Windows servers
# depend on. The TypeScript build compiles 9b151c4c to WebAssembly
# (client/scripts/build-ironrdp.mjs); that commit pins picky =7.0.0-rc.25,
# whose curve25519-dalek =5.0.0-rc.1 cannot resolve next to russh. f1e218e5 is
# IronRDP master of 2026-11-06 (sspi 0.23.1, picky rc.27 on the final RustCrypto
# releases, the same rsa and pkcs1 prereleases russh pins): 269 commits ahead of
# 9b151c4c and none behind, so it keeps those fixes. Do not move back to a
# revision that pins picky =7.0.0-rc.25.
ironrdp = { git = "https://github.com/Devolutions/IronRDP", rev = "f1e218e58dc60c0579a8aba25e67077bf80be32b", features = [
    "cliprdr",
    "connector",
    "displaycontrol",
    "dvc",
    "graphics",
    "input",
    "session",
    "svc",
] }
ironrdp-tokio = { git = "https://github.com/Devolutions/IronRDP", rev = "f1e218e58dc60c0579a8aba25e67077bf80be32b" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1"
webpki-roots = "1"
x509-parser = "0.18"

[dev-dependencies]
async-trait = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
ironrdp-server = { git = "https://github.com/Devolutions/IronRDP", rev = "f1e218e58dc60c0579a8aba25e67077bf80be32b", default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
