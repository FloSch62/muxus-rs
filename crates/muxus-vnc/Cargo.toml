[package]
name = "muxus-vnc"
description = "VNC transport"
version.workspace = true
edition.workspace = true
license = "MIT AND MPL-2.0"
rust-version.workspace = true

[dependencies]
muxus-core.workspace = true
aes = "0.9"
async-channel = "2"
des = "0.9"
eax = "0.6"
flate2 = "1"
md-5 = "0.11"
num-bigint = "0.4"
png = "0.18"
rand = "0.10"
rsa = "0.10.0-rc.18"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"
zune-jpeg = "0.5"

[dev-dependencies]
des = "0.9"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
