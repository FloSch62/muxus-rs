[package]
name = "muxus-term"
description = "Terminal emulation engine, schemes, keyword highlighting, scrollback snapshots"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-channel = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
fancy-regex = "0.14"
futures-lite = "2"
memchr = "2"
muxus-core.workspace = true
par-term-emu-core-rust = { version = "=0.60.0", default-features = false }
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
