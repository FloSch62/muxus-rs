[package]
name = "muxus-passwords"
description = "Login passwords read from external password managers (KeePass, pass, 1Password, Bitwarden, Proton Pass, LastPass, Dashlane)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
muxus-core.workspace = true
async-trait = "0.1"
base64 = "0.23"
hex = "0.4"
# KDBX 3.1 and 4 with AES-KDF and Argon2, in Rust: nothing has to be installed or running.
keepass = "0.17"
percent-encoding = "2"
regex = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
