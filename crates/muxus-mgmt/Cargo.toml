[package]
name = "muxus-mgmt"
description = "Network device management: gNMI, gNOI, gNSI, NETCONF"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
muxus-core.workspace = true
async-channel = "2"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body = "1"
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
indexmap = "2"
md-5 = "0.10"
percent-encoding = "2"
prost = "0.14"
prost-reflect = "0.16"
prost-types = "0.14"
quick-xml = "0.41"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tonic-prost = "0.14"
tower-service = "0.3"
tracing = "0.1"
webpki-roots = "1"
x509-parser = "0.18"

[dev-dependencies]
h2 = "0.4"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tokio = { version = "1", features = ["full", "test-util"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "server", "router"] }

[build-dependencies]
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
protox = "0.10"
tonic-prost-build = { version = "0.14", default-features = false }

[lints]
workspace = true
