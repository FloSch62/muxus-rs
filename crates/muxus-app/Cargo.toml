[package]
name = "muxus-app"
description = "The Muxus desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "muxus"

[lib]
name = "muxus_app"
path = "src/lib.rs"

[[bin]]
name = "muxus"
path = "src/main.rs"

# Windows: COMSPEC for the bundled X server, so its keymap compiles open no console windows.
# Ships next to muxus.exe.
[[bin]]
name = "muxus-hidden-cmd"
path = "src/bin/muxus-hidden-cmd.rs"

[features]
# Saved web pages in Muxus browser windows (wry; WebKitGTK 4.1 on Linux, see
# crates/muxus-webview). Release packages build with it; without it pages open in the
# system browser.
webview = ["muxus-webview/webview"]

[dependencies]
muxus-core.workspace = true
muxus-import.workspace = true
muxus-store.workspace = true
muxus-local.workspace = true
muxus-mgmt.workspace = true
muxus-os.workspace = true
muxus-session.workspace = true
muxus-ssh.workspace = true
muxus-term.workspace = true
muxus-term-view.workspace = true
muxus-ui.workspace = true
muxus-webview.workspace = true
async-channel = "2"
indexmap = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Lookarounds of the compare dialog's timestamp pattern (already in the tree via muxus-term).
fancy-regex = "0.20"
futures-lite = "2"
regex = "1"
# Anchored multi-pattern matching for the General Text tokenizer (already in the tree via regex).
regex-automata = "0.4"
# The link opener speaks the editor's go-to-definition types (already in the tree via gpui-kit).
anyhow = "1"
lsp-types = "0.97"
sha2 = "0.11"
tree-sitter = "0.26.13"
serde = "1"
serde_json = "1"
similar = "3"
base64 = "0.23"
tokio = { version = "1", features = ["rt", "sync", "time"] }
unicode-normalization = "0.1"
url = "2"
# Remote desktop tiles are GPUI images (`image::Frame`), as in muxus-term-view.
image = { version = "0.25", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The single-instance named pipe (features/desktop).
tokio = { version = "1", features = ["io-util", "net", "rt"] }

[dev-dependencies]
tempfile = "3"
# Headless windows for the UI regression tests (tests/ui_*.rs).
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
muxus-ssh = { workspace = true, features = ["testing"] }
russh = "0.65.1"
bytes = "1"
h2 = "0.4"
http = "1"
prost = "0.14"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
# The remote_desktop example serves its desktop from IronRDP's own server (muxus-rdp's revision).
ironrdp-server = { git = "https://github.com/Devolutions/IronRDP", rev = "f1e218e58dc60c0579a8aba25e67077bf80be32b", default-features = false }
async-trait = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[lints]
workspace = true
