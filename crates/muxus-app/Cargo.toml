[package]
name = "muxus-app"
description = "The Muxus desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "muxus_app"
path = "src/lib.rs"

[[bin]]
name = "muxus"
path = "src/main.rs"

[dependencies]
muxus-core.workspace = true
muxus-import.workspace = true
muxus-store.workspace = true
muxus-local.workspace = true
muxus-mgmt.workspace = true
muxus-session.workspace = true
muxus-ssh.workspace = true
muxus-term.workspace = true
muxus-term-view.workspace = true
muxus-ui.workspace = true
async-channel = "2"
indexmap = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-lite = "2"
regex = "1"
sha2 = "0.10"
tree-sitter = "0.26.13"
serde = "1"
serde_json = "1"
similar = "2"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "sync", "time"] }
unicode-normalization = "0.1"
# Remote desktop tiles are GPUI images (`image::Frame`), as in muxus-term-view.
image = { version = "0.25", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The single-instance named pipe (features/desktop).
tokio = { version = "1", features = ["io-util", "net", "rt"] }

[dev-dependencies]
tempfile = "3"
# Headless windows for the UI regression tests (tests/ui_*.rs).
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
muxus-ssh = { workspace = true, features = ["testing"] }
russh = "0.64"
bytes = "1"
h2 = "0.4"
http = "1"
prost = "0.14"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
# The remote_desktop example serves its desktop from IronRDP's own server (muxus-rdp's revision).
ironrdp-server = { git = "https://github.com/Devolutions/IronRDP", rev = "d90284f5f28dc24bb39c78883521721de76bf52f", default-features = false }
async-trait = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[lints]
workspace = true
