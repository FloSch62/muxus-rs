[package]
name = "muxus-local"
description = "Local terminal sessions on a pty, shell profiles and launchers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
muxus-core.workspace = true
async-channel = "2"
base64 = "0.22"
portable-pty = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
