[package]
name = "muxus-os"
description = "Windows and macOS calls without C build steps (taskbar jump list, local machine readings), so `cargo check --target` covers them from any host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
muxus-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The versions the rest of the tree already builds on Windows (muxus-store, gpui).
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemInformation",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }

[lints]
workspace = true
