name: Packages

# Release packages for every desktop: the Debian package, the macOS disk image and a
# Windows zip. Run it by hand (Actions → Packages → Run workflow) or by pushing a v* tag;
# the packages are the run's artifacts.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml keeps local builds to 3 jobs; a runner has the machine to itself.
  CARGO_BUILD_JOBS: 4

jobs:
  deb:
    name: Linux (.deb)
    # The oldest supported runner, so the package runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config dpkg-dev desktop-file-utils \
            libfontconfig-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Every platform's crates: the license list reads `cargo metadata --offline`.
      - run: cargo fetch --locked
      - run: cargo build --release --locked -p muxus-app
      - run: packaging/build-deb.sh
        env:
          MUXUS_PACKAGE_DIR: dist
      - uses: actions/upload-artifact@v4
        with:
          name: muxus-linux-deb
          path: dist/*.deb
          if-no-files-found: error

  dmg:
    name: macOS (.dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Every platform's crates: the license list reads `cargo metadata --offline`.
      - run: cargo fetch --locked
      - run: cargo build --release --locked -p muxus-app --target aarch64-apple-darwin
      - run: cargo build --release --locked -p muxus-app --target x86_64-apple-darwin
      - name: Universal binary
        run: |
          lipo -create -output target/muxus \
            target/aarch64-apple-darwin/release/muxus target/x86_64-apple-darwin/release/muxus
      - run: packaging/build-dmg.sh
        env:
          MUXUS_BINARY: target/muxus
          MUXUS_PACKAGE_DIR: dist
      - uses: actions/upload-artifact@v4
        with:
          name: muxus-mac-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (.zip)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      # aws-lc-sys assembles its crypto code with NASM on Windows.
      - uses: ilammy/setup-nasm@v1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Every platform's crates: the license list reads `cargo metadata --offline`.
      - run: cargo fetch --locked
      - run: cargo build --release --locked -p muxus-app
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$').Matches[0].Groups[1].Value
          $stage = "dist/Muxus"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/muxus.exe $stage
          Copy-Item packaging/LICENSE, ATTRIBUTION.md $stage
          Get-ChildItem assets/fonts/*-LICENSE.txt, assets/icons/LICENSE-*.txt | Copy-Item -Destination $stage
          python -I -X utf8 packaging/third_party_licenses.py "$stage/THIRD_PARTY_LICENSES.txt" --target x86_64-pc-windows-msvc
          Compress-Archive -Path $stage -DestinationPath "dist/muxus-$version-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: muxus-windows-zip
          path: dist/*.zip
          if-no-files-found: error
