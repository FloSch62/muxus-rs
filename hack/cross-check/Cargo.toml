# The platform modules of crates that build C (and so cannot be checked for another target
# without its C toolchain), compiled on their own. Run through `hack/cross-check.sh`, which
# copies the workspace's Cargo.lock here first so the versions are the app's.
[package]
name = "muxus-cross-check"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
muxus-core = { path = "../../crates/muxus-core" }
muxus-import = { path = "../../crates/muxus-import" }
muxus-os = { path = "../../crates/muxus-os" }
muxus-session = { path = "session-stub", package = "muxus-session-stub" }
async-channel = "2"
async-trait = "0.1"
dns-lookup = "4"
keyring-core = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
zeroize = "1"

# As in crates/muxus-store/Cargo.toml.
[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
