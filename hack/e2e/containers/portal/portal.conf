server {
  listen 80;
  root /usr/share/nginx/html;
  default_type text/plain;
  # Redirects to a path stay paths: the port published on the host is not this one.
  absolute_redirect off;

  # The address a portal hands out leads to the list in two steps: one to a full address,
  # one to a path.
  location = /me { return 301 $scheme://$http_host/moved; }
  location = /moved { return 302 /lists/lab.mxtsessions; }
  location = /loop { return 302 /loop; }
  location /private/ { return 403; }
  location = /signin {
    default_type text/html;
    return 200 "<!DOCTYPE html><html><body>Sign in</body></html>";
  }
}

server {
  listen 443 ssl;
  ssl_certificate /etc/nginx/certs/server.pem;
  ssl_certificate_key /etc/nginx/certs/server.key;
  root /usr/share/nginx/html;
  default_type text/plain;
}

server {
  listen 444 ssl;
  ssl_certificate /etc/nginx/certs/selfsigned.pem;
  ssl_certificate_key /etc/nginx/certs/selfsigned.key;
  root /usr/share/nginx/html;
  default_type text/plain;
}
